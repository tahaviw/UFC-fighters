<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Fighter Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/icons/UFC.png">
    <script type="module" src="./js/app.js" defer></script>
</head>
<body>
    <img src="assets/images/UFC-3.png" alt="UFC Logo" class="logo">
    <h2>Choose a Fighter</h2>

    </div>
    <footer>
        <p>Developed by Taha Belghiti Junior Front-End Developer Passionate about combat sports and technology.</p>
        <h3>Built with HTML, CSS, and JavaScript.<br>© 2026</h3>
        <img src="assets/images/UFC-2.png" alt="UFC Logo" class="logo-footer">
    </footer>
</body>
</html>
